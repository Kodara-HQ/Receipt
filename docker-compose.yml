# Optional. Local development uses XAMPP MySQL on port 3306 instead.
# Only start this if XAMPP is not running, to avoid a port conflict.
services:
  db:
    image: mariadb:11
    container_name: fragrance-universe-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: fragrance_universe
    ports:
      - "3306:3306"
    volumes:
      - mariadata:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  mariadata:
